services:
  ros2_fastapi_server:
    build:
      context: .
      dockerfile: mio_robot_description/Dockerfile

    container_name: ros2_fastapi_container

    ports:
      - "8000:8000"

    volumes:
      - .:/ros2_ws/src

      # WSLg
      - \\wsl$\Ubuntu\mnt\wslg:/mnt/wslg
      - \\wsl$\Ubuntu\run\user\1000:/run/user/1000

      # X11 WSLg
      - \\wsl$\Ubuntu\mnt\wslg\.X11-unix:/tmp/.X11-unix

    environment:
      - DISPLAY=:0
      - WAYLAND_DISPLAY=wayland-0
      - XDG_RUNTIME_DIR=/run/user/1000
      - QT_X11_NO_MITSHM=1